<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t">
  <title id="t">A clean, bright developer workspace with a laptop showing code, a potted plant and a coffee mug</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAFE"/>
      <stop offset="1" stop-color="#ECE7F7"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1ECFF"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFEBF7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D2566"/>
      <stop offset="1" stop-color="#1B1640"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F1F8"/>
      <stop offset="1" stop-color="#D9D4E6"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B21F5"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="720" height="440" fill="url(#wall)"/>

  <!-- window with daylight -->
  <g>
    <rect x="478" y="34" width="196" height="236" rx="6" fill="url(#win)" stroke="#E3DCF2" stroke-width="4"/>
    <path d="M576 34v236M478 152h196" stroke="#E3DCF2" stroke-width="4"/>
    <rect x="486" y="42" width="84" height="104" fill="#F7F3FF"/>
    <rect x="582" y="160" width="84" height="104" fill="#F7F3FF"/>
  </g>
  <path d="M478 270L330 440H560L674 270Z" fill="url(#ray)" opacity=".55"/>

  <!-- shelf with books -->
  <rect x="70" y="92" width="190" height="8" rx="4" fill="#E2DAF4"/>
  <rect x="86" y="50" width="14" height="42" rx="3" fill="#C9B8F7"/>
  <rect x="102" y="58" width="12" height="34" rx="3" fill="#8B5CF6"/>
  <rect x="116" y="46" width="16" height="46" rx="3" fill="#E9E2FB"/>
  <rect x="134" y="62" width="40" height="30" rx="4" fill="#FFFFFF" stroke="#E2DAF4" stroke-width="2"/>
  <circle cx="220" cy="78" r="14" fill="#FFFFFF" stroke="#E2DAF4" stroke-width="2"/>
  <path d="M214 76c4-10 10-12 14-10-2 6-8 10-14 10Z" fill="#5CC291"/>

  <!-- desk -->
  <path d="M0 300h720v140H0Z" fill="url(#deskTop)"/>
  <path d="M0 300h720" stroke="#E4DEF1" stroke-width="3"/>

  <!-- soft shadows on the desk -->
  <ellipse cx="372" cy="330" rx="190" ry="14" fill="#B9AEDB" opacity=".45" filter="url(#soft)"/>
  <ellipse cx="132" cy="316" rx="56" ry="9" fill="#B9AEDB" opacity=".5" filter="url(#soft)"/>
  <ellipse cx="596" cy="318" rx="34" ry="7" fill="#B9AEDB" opacity=".5" filter="url(#soft)"/>

  <!-- plant -->
  <g transform="translate(92 150)">
    <path d="M40 92C14 74 2 40 10 8c26 18 36 52 30 84Z" fill="#3FA674"/>
    <path d="M44 92c-4-36 10-70 40-86 6 34-10 66-40 86Z" fill="#56BE8C"/>
    <path d="M38 94C10 92-14 74-20 52c26-2 50 14 58 42Z" fill="#3A9B6F"/>
    <path d="M46 94c18-24 46-34 70-28-10 24-38 34-70 28Z" fill="#4DB585"/>
    <path d="M42 96C38 62 42 34 54 10" stroke="#2F8A60" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M2 94h80l-8 70H10Z" fill="#FFFFFF" stroke="#E2DAF4" stroke-width="2"/>
    <path d="M4 112h76" stroke="#F0EBFC" stroke-width="8"/>
  </g>

  <!-- laptop -->
  <g>
    <rect x="248" y="128" width="248" height="164" rx="12" fill="#D6D1E3"/>
    <rect x="254" y="134" width="236" height="152" rx="8" fill="url(#screen)"/>
    <!-- editor UI on screen -->
    <rect x="254" y="134" width="236" height="18" rx="8" fill="#241E52"/>
    <circle cx="266" cy="143" r="3" fill="#FF6B8B"/>
    <circle cx="276" cy="143" r="3" fill="#FFC857"/>
    <circle cx="286" cy="143" r="3" fill="#5CC291"/>
    <rect x="254" y="152" width="40" height="134" fill="#211B4A"/>
    <rect x="262" y="164" width="22" height="4" rx="2" fill="#5B4FA8"/>
    <rect x="262" y="174" width="18" height="4" rx="2" fill="#5B4FA8"/>
    <rect x="262" y="184" width="24" height="4" rx="2" fill="#8B5CF6"/>
    <rect x="262" y="194" width="16" height="4" rx="2" fill="#5B4FA8"/>
    <rect x="306" y="164" width="44" height="5" rx="2.5" fill="#C084FC"/>
    <rect x="356" y="164" width="70" height="5" rx="2.5" fill="#7DD3FC"/>
    <rect x="318" y="176" width="58" height="5" rx="2.5" fill="#F9A8D4"/>
    <rect x="382" y="176" width="40" height="5" rx="2.5" fill="#A5B4FC"/>
    <rect x="318" y="188" width="90" height="5" rx="2.5" fill="#86EFAC"/>
    <rect x="330" y="200" width="52" height="5" rx="2.5" fill="#C084FC"/>
    <rect x="388" y="200" width="60" height="5" rx="2.5" fill="#FDE68A"/>
    <rect x="330" y="212" width="74" height="5" rx="2.5" fill="#7DD3FC"/>
    <rect x="318" y="224" width="36" height="5" rx="2.5" fill="#F9A8D4"/>
    <rect x="306" y="236" width="28" height="5" rx="2.5" fill="#C084FC"/>
    <rect x="318" y="248" width="96" height="5" rx="2.5" fill="#A5B4FC"/>
    <rect x="306" y="260" width="40" height="5" rx="2.5" fill="#C084FC"/>
    <!-- base -->
    <path d="M226 292h292l22 20H204Z" fill="url(#base)"/>
    <path d="M204 312h336v6a4 4 0 0 1-4 4H208a4 4 0 0 1-4-4Z" fill="#C9C2DA"/>
    <path d="M350 292h44l-4 6h-36Z" fill="#C9C2DA"/>
  </g>

  <!-- mug -->
  <g transform="translate(572 262)">
    <path d="M0 4h44v34a14 14 0 0 1-14 14H14A14 14 0 0 1 0 38Z" fill="#FFFFFF" stroke="#E2DAF4" stroke-width="2"/>
    <path d="M44 14h6a10 10 0 0 1 0 20h-6" fill="none" stroke="#E2DAF4" stroke-width="5"/>
    <ellipse cx="22" cy="4" rx="22" ry="4" fill="#6B3E2A"/>
    <path d="M10 22h24" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <path d="M12-8c-5-6 5-10 0-18M24-6c-5-6 5-10 0-18" fill="none" stroke="#D8CCFB" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- notebook and pen -->
  <g transform="translate(560 352) rotate(-8)">
    <rect width="96" height="64" rx="6" fill="#F3EEFF" stroke="#E2DAF4" stroke-width="2"/>
    <rect x="8" width="6" height="64" fill="#C9B8F7"/>
    <path d="M24 18h56M24 30h48M24 42h52" stroke="#DCD2F6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="514" y="388" width="74" height="6" rx="3" fill="url(#brand)" transform="rotate(-20 551 391)"/>
</svg>
